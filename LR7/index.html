<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <title>ЛР7 - Відображення текстур</title>
    <style>
        body {
            background-color: #e8e8e8;
            font-family: Arial, sans-serif;
            text-align: center;
            font-size: 14px;
        }
        canvas {
            border: 1px solid #555;
            cursor: pointer;
        }
        .panel {
            margin: 6px;
        }
        .panel label {
            margin: 0 8px;
        }
        input[type=range] {
            width: 120px;
            vertical-align: middle;
        }
        #error {
            color: #b00;
        }
    </style>

    <script id="vertex-shader" type="x-shader/x-vertex">
        attribute vec3 a_Position;
        attribute vec2 a_TexCoord;
        attribute float a_Shade;
        uniform mat4 u_MVP;
        varying vec2 v_TexCoord;
        varying float v_Shade;

        void main() {
            gl_Position = u_MVP * vec4(a_Position, 1.0);
            v_TexCoord = a_TexCoord;
            v_Shade = a_Shade;
        }
    </script>

    <script id="fragment-shader" type="x-shader/x-fragment">
        precision mediump float;
        uniform sampler2D u_Sampler0;
        uniform sampler2D u_Sampler1;
        uniform bool u_UseExtra;
        uniform float u_Mix;
        varying vec2 v_TexCoord;
        varying float v_Shade;

        void main() {
            vec4 base = texture2D(u_Sampler0, v_TexCoord);
            vec3 color = base.rgb;

            if (u_UseExtra) {
                vec4 extra = texture2D(u_Sampler1, v_TexCoord);
                color = mix(color, extra.rgb, extra.a * u_Mix);
            }

            gl_FragColor = vec4(color * v_Shade, 1.0);
        }
    </script>

    <script src="matrix.js"></script>
    <script src="main.js"></script>
</head>
<body>
    <h3>Лабораторна робота 7. Відображення текстур</h3>

    <div class="panel">
        <label><input type="checkbox" id="useExtra"> Додаткова текстура (мох)</label>
        <label>Сила <input type="range" id="mix" min="0" max="1" step="0.05" value="0.8"></label>
        <label><input type="checkbox" id="rotate" checked> Обертання</label>
    </div>

    <canvas id="glcanvas" width="640" height="480"></canvas>
    <p>Клікніть по канвасу, щоб змінити текстуру</p>
    <p id="info"></p>
    <p id="error"></p>
</body>
</html>
