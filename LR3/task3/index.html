<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <title>ЛР3 - Завдання 3</title>
    <style>
        body {
            background-color: #e8e8e8;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        canvas {
            border: 1px solid #555;
        }
        .panel {
            margin: 8px;
        }
    </style>

    <script id="vertex-shader" type="x-shader/x-vertex">
        attribute vec3 aPosition;
        attribute vec3 aColor;
        uniform mat4 uModel;
        uniform mat4 uView;
        uniform mat4 uProjection;
        varying vec3 vColor;

        void main() {
            gl_Position = uProjection * uView * uModel * vec4(aPosition, 1.0);
            vColor = aColor;
        }
    </script>

    <script id="fragment-shader" type="x-shader/x-fragment">
        precision mediump float;
        varying vec3 vColor;

        void main() {
            gl_FragColor = vec4(vColor, 1.0);
        }
    </script>

    <script src="matrix.js"></script>
    <script src="main.js"></script>
</head>
<body>
    <h3>Завдання 3. Куб з різнокольоровими гранями</h3>
    <div class="panel">
        <label><input type="radio" name="proj" value="persp" checked> Перспективна</label>
        <label><input type="radio" name="proj" value="ortho"> Ортогональна</label>
    </div>
    <canvas id="glcanvas" width="640" height="480"></canvas>
</body>
</html>
