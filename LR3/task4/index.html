<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <title>ЛР3 - Завдання 4</title>
    <style>
        body {
            background-color: #e8e8e8;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        canvas {
            border: 1px solid #555;
        }
        .panel {
            margin: 6px;
            font-size: 14px;
        }
        .panel label {
            margin: 0 8px;
        }
        input[type=range] {
            width: 110px;
            vertical-align: middle;
        }
    </style>

    <script id="vertex-shader" type="x-shader/x-vertex">
        attribute vec3 aPosition;
        attribute vec3 aColor;
        uniform mat4 uModel;
        uniform mat4 uView;
        uniform mat4 uProjection;
        varying vec3 vColor;

        void main() {
            gl_Position = uProjection * uView * uModel * vec4(aPosition, 1.0);
            vColor = aColor;
        }
    </script>

    <script id="fragment-shader" type="x-shader/x-fragment">
        precision mediump float;
        varying vec3 vColor;

        void main() {
            gl_FragColor = vec4(vColor, 1.0);
        }
    </script>

    <script src="matrix.js"></script>
    <script src="main.js"></script>
</head>
<body>
    <h3>Завдання 4. Анімація куба</h3>

    <div class="panel">
        Швидкість обертання (град/с):
        <label>X <input type="range" id="speedX" min="0" max="180" value="30"></label>
        <label>Y <input type="range" id="speedY" min="0" max="180" value="60"></label>
        <label>Z <input type="range" id="speedZ" min="0" max="180" value="0"></label>
    </div>

    <div class="panel">
        <label><input type="checkbox" id="pulse" checked> Пульсація розміру</label>
        <label><input type="checkbox" id="orbit"> Рух по колу</label>
        <label>
            Проекція:
            <select id="proj">
                <option value="persp">Перспективна</option>
                <option value="ortho">Ортогональна</option>
            </select>
        </label>
        <button id="pauseBtn">Пауза</button>
    </div>

    <canvas id="glcanvas" width="640" height="480"></canvas>
</body>
</html>
